let phonemePlayer=null,soundSequence=0;
function haltSpeech(){
  soundSequence++;clearTimeout(voiceTimer);
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  if(phonemePlayer){phonemePlayer.pause();phonemePlayer=null;}
}
function playPhoneme(g,onEnd=null){
  if(S.mute){if(onEnd)onEnd();return;}
  const encoded=PHONEME_AUDIO[g];
  if(!encoded){if(onEnd)onEnd();return;}
  haltSpeech();const id=soundSequence;
  const audio=new Audio('data:audio/mpeg;base64,'+encoded);
  phonemePlayer=audio;
  audio.onended=()=>{if(id!==soundSequence)return;phonemePlayer=null;if(onEnd)onEnd();};
  audio.onerror=()=>{if(id!==soundSequence)return;phonemePlayer=null;};
  const started=audio.play();
  if(started&&started.catch)started.catch(()=>{if(id!==soundSequence)return;phonemePlayer=null;});
}

ata-action="phoneme" data-phoneme="${g}">🔊 ${g}</button>`).join('')}</div></div><p style="font-size:14px">Phonics buttons play built-in British English sound recordings (even offline), rather than reading the letter names. Whole words use the voices installed on your device, which may vary between browsers.</p></section><section class="grown-card"><h3>📚 Lesson record</h3><div style="overflow:auto"><table class="record-table"><thead><tr><th>Level</th><th>Best stars</th><th>Plays</th><th>Tricky words</th></tr></thead><tbody>${allLessons.map(l=>{const p=S.progress[l.id];return `<tr><td>${esc(l.title||label(l))}</td><td>${p?'⭐'.repeat(p.stars):'—'}</td><td>${p?p.plays:0}</td><td>${p?.tricky?.length?p.tricky.map(esc).join(', '):'—'}</td></tr>`}).join('')}</tbody></table></div></section><section class="grown-card"><h3>⚙️ Progress options</h3><p>No timers or penalties for taking longer. A child can tap speaker icons for help and retry answers.</p><button class="btn mini pink" data-action="reset">Reset all progress</button></section>`}
function render(){const app=$('#app');if(!app)return;app.innerHTML=header()+({home:homeView,course:courseView,lesson:lessonView,reward:rewardView,stickers:stickersView,parent:parentView}[S.screen]||homeView)()+`<footer class="footer">Made for Howie, our little sound explorer 🌟 <button class="tiny-action" data-action="parent">Grown-ups</button></footer>`}
function choice(v){const st=current();if(S.busy)return;if(st.choices[+v]===st.answer){winStep('Brilliant! That’s right! ⭐');if(st.type==='sound-pick')playPhoneme(st.answer);else speak(st.say||st.word||st.answer)}else{mistake(st.word);speak('Try again.')}}
function putTile(i){const st=current();if(S.busy||S.placed.includes(i))return;const pos=S.placed.indexOf(null);if(pos<0)return;if(st.tiles[i].t!==st.parts[pos]){mistake(st.word);speak('Try again.');return}S.placed[pos]=i;if(S.placed.every(x=>x!=null)){winStep('You built the word! 🎉');speak(st.word)}else{ding();render()}}
function paint(i){const st=current();if(S.busy||S.painted[i])return;const expect=st.letters[i].v?'v':'c';if(expect!==S.pot){mistake(st.word);speak(expect==='v'?'That is a vowel. Use pink.':'That is a consonant. Use blue.');return}S.painted[i]=true;if(S.painted.every(Boolean)){winStep('Beautiful colours! 🌈');speak(st.word)}else{ding();render()}}
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;switch(a){case'home':route('home');break;case'course':S.course=b.dataset.cid||S.course;route('course');break;case'start':enterLesson(b.dataset.cid,b.dataset.lid);break;case'stickers':route('stickers');break;case'parent':route('parent');break;case'mute':S.mute=!S.mute;if(S.mute)stop();save();render();break;case'next':nextStep();break;case'answer':choice(b.dataset.choice);break;case'tile':putTile(+b.dataset.tile);break;case'pot':S.pot=b.dataset.pot;render();break;case'paint':paint(+b.dataset.index);break;case'speak':speak(b.dataset.say);break;case'phoneme':playPhoneme(b.dataset.phoneme);break;case'readstory':readStory();break;case'storyprev':storyGo(-1);break;case'storynext':storyGo(1);break;case'replay-instruction':speakInstr();break;case'rate':S.rate=+b.dataset.rate;save();render();speak('Hello Howie. Let’s learn together.');break;case'testvoice':speak('Hello Howie! All aboard the phonics train!');break;case'reset':if(confirm('Delete all lesson stars and progress?')){S.progress={};save();render()}break;}});
document.addEventListener('change',e=>{if(e.target.id==='voice-select'){S.voiceName=e.target.value;save();speak('Hello Howie! Let’s read!')}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.screen==='lesson')route('course')});
if('speechSynthesis'in window)window.speechSynthesis.addEventListener('voiceschanged',()=>{if(S.screen==='parent')render()});
render();
</script>
</body>
