<body>
<div class="app">
  <header><div class="brand-mark" aria-hidden="true">›</div><div class="brand">Compare Quest</div><div class="spacer"></div><div class="stars" aria-label="Stars earned">⭐ <span id="starCount">0</span></div><button class="icon-btn" id="soundToggle" aria-label="Turn sound off">🔊</button></header>
  <main>
    <section class="screen home active" id="home">
      <div class="mascot" aria-hidden="true">🐊</div>
      <h1>Let’s compare!</h1>
      <p>Revise the words and signs. Then try the worksheet challenges!</p>
      <button class="primary" data-level="0" style="margin-bottom:24px">📖 Start here · Revision</button>
      <div class="level-grid">
        <button class="level-card" data-level="1"><span class="level-num">Level 1 · 15 questions</span><strong>Pictures & words</strong><span>Count and fill in the gaps.</span><span class="level-icon">🔎</span></button>
        <button class="level-card" data-level="2"><span class="level-num">Level 2 · 15 questions</span><strong>Make & compare</strong><span>Build groups. Choose signs.</span><span class="level-icon">🎯</span></button>
        <button class="level-card" data-level="3"><span class="level-num">Level 3 · 10 puzzles</span><strong>Number mysteries</strong><span>Think through clues in steps.</span><span class="level-icon">🧩</span></button>
      </div>
    </section>
    <section class="screen game-shell" id="game">
      <div class="topline"><button class="back" id="backBtn">← Home</button><div class="progress" aria-label="Level progress"><i id="progressBar"></i></div><div class="counter" id="counter"></div></div>
      <article class="card" id="gameCard" aria-live="polite"></article>
    </section>
  </main>
</div>
<script>
(()=>{

const revisions=[
 {title:'Greater than · More than',sign:'>',left:5,right:2,text:'5 is greater than 2. There are more cubes on the left than on the right.',tip:'Greater than means a bigger number. More than means a bigger group. The wide opening faces the bigger number.'},
 {title:'Less than · Fewer than',sign:'<',left:2,right:5,text:'2 is less than 5. There are fewer cubes on the left than on the right.',tip:'Less than means a smaller number. Fewer than means a smaller group. The small point faces the smaller number.'},
 {title:'Equal to',sign:'=',left:4,right:4,text:'4 is equal to 4. Both groups have the same number of cubes.',tip:'Equal to means the same amount. Use two straight lines: the equals sign.'}
];
const levels={
 1:[
 {kind:'choice',q:'Choose a word to fill the gap.',sentence:'Kim has ___ cubes than Ron.',groups:[['Kim',6,'cube'],['Ron',8,'cube']],answers:['more','fewer'],ok:1,ex:'Kim has 6 cubes and Ron has 8. Kim has fewer cubes than Ron.'},
 {kind:'choice',q:'Choose a word to fill the gap.',sentence:'Ron has ___ cubes than Kim.',groups:[['Kim',6,'cube'],['Ron',8,'cube']],answers:['more','fewer'],ok:0,ex:'8 is greater than 6. Ron has more cubes than Kim.'},
 {kind:'choice',q:'Which picture shows more carrots?',groups:[['Picture A',2,'🥕'],['Picture B',5,'🥕']],answers:['Picture A','Picture B'],ok:1,ex:'Picture B has 5 carrots. 5 is more than 2.'},
 {kind:'choice',q:'Which picture shows more counters?',groups:[['Picture A',6,'frame'],['Picture B',7,'frame']],answers:['Picture A','Picture B'],ok:1,ex:'Picture B has 7 counters. 7 is more than 6.'},
 {kind:'choice',q:'Choose the missing phrase.',sentence:'9 is ___ 8.',groups:[['9',9,'cube'],['8',8,'cube']],answers:['less than','greater than','equal to'],ok:1,ex:'9 is greater than 8, so we write 9 > 8.'},
 {kind:'choice',q:'Choose the missing phrase.',sentence:'10 is ___ 20.',groups:[['10',10,'tens'],['20',20,'tens']],answers:['equal to','greater than','less than'],ok:2,ex:'10 is less than 20. One ten is less than two tens.'},
 {kind:'choice',q:'Choose the missing phrase.',sentence:'1 ten and 2 ones is ___ 12.',groups:[['1 ten and 2 ones',12,'tens'],['12',12,'cube']],answers:['equal to','less than','greater than'],ok:0,ex:'1 ten is 10. 10 and 2 make 12. Both amounts are equal: 12 = 12.'},
{"kind":"choice","q":"Which picture shows more cakes?","groups":[["Picture A",8,"🧁"],["Picture B",5,"🧁"]],"answers":["Picture A","Picture B"],"ok":0,"ex":"Picture A has 8 cakes. 8 is more than 5."},
{"kind":"choice","q":"Which picture shows fewer apples?","groups":[["Picture A",7,"🍎"],["Picture B",4,"🍎"]],"answers":["Picture A","Picture B"],"ok":1,"ex":"Picture B has 4 apples. 4 is fewer than 7."},
{"kind":"choice","q":"Choose a word to fill the gap.","sentence":"Ava has ___ cubes than Ben.","groups":[["Ava",5,"cube"],["Ben",9,"cube"]],"answers":["fewer","more"],"ok":0,"ex":"5 is less than 9. Ava has fewer cubes than Ben."},
{"kind":"choice","q":"Choose a word to fill the gap.","sentence":"Leo has ___ cubes than Mia.","groups":[["Leo",10,"cube"],["Mia",7,"cube"]],"answers":["fewer","more"],"ok":1,"ex":"10 is greater than 7. Leo has more cubes than Mia."},
{"kind":"choice","q":"Choose the missing phrase.","sentence":"6 is ___ 6.","groups":[["6",6,"frame"],["6",6,"cube"]],"answers":["greater than","less than","equal to"],"ok":2,"ex":"Both groups have 6. 6 is equal to 6."},
{"kind":"choice","q":"Choose the missing phrase.","sentence":"0 is ___ 3.","groups":[["0",0,"cube"],["3",3,"cube"]],"answers":["less than","equal to","greater than"],"ok":0,"ex":"Zero means no cubes. 0 is less than 3."},
{"kind":"choice","q":"Choose the missing phrase.","sentence":"14 is ___ 1 ten and 1 one.","groups":[["14",14,"cube"],["1 ten and 1 one",11,"tens"]],"answers":["equal to","greater than","less than"],"ok":1,"ex":"1 ten and 1 one makes 11. 14 is greater than 11."},
{"kind":"choice","q":"Choose the missing phrase.","sentence":"1 ten and 6 ones is ___ 16.","groups":[["1 ten and 6 ones",16,"tens"],["16",16,"cube"]],"answers":["greater than","less than","equal to"],"ok":2,"ex":"10 and 6 make 16. Both amounts are equal."}
 ],
 2:[

 {kind:'build',q:'Make pictures to match the sentence.',sentence:'13 is less than 1 ten and 4 ones.',targets:[13,14],sign:'<',ex:'1 ten and 4 ones makes 14. 13 is less than 14.'},
 {kind:'choice',q:'Choose <, > or = to compare.',sentence:'2 ___ 12',groups:[['2 counters',2,'frame'],['12',12,'tens']],answers:['<','>','='],ok:0,ex:'2 is less than 12: 2 < 12.'},
 {kind:'choice',q:'Choose <, > or = to compare.',sentence:'6 ___ 1 ten',groups:[['6 cubes',6,'cube'],['1 ten',10,'tens']],answers:['=','>','<'],ok:2,ex:'1 ten means 10. 6 is less than 10: 6 < 10.'},
 {kind:'choice',q:'Choose <, > or = to compare.',sentence:'15 ___ 1 ten and 5 ones',groups:[['15',15,'cube'],['1 ten and 5 ones',15,'tens']],answers:['>','=','<'],ok:1,ex:'1 ten and 5 ones makes 15. 15 is equal to 15.'},
 {kind:'choice',q:'Choose <, > or = to compare.',sentence:'10 ___ 0',groups:[['10',10,'tens'],['0',0,'cube']],answers:['<','=','>'],ok:2,ex:'10 is greater than 0. Zero means no cubes.'},
{"kind":"build","q":"Make pictures to match the sentence.","sentence":"5 is equal to 5.","targets":[5,5],"sign":"=","ex":"Each picture has 5 cubes. 5 is equal to 5."},
{"kind":"build","q":"Make pictures to match the sentence.","sentence":"9 is greater than 6.","targets":[9,6],"sign":">","ex":"9 cubes is more than 6 cubes. 9 is greater than 6."},
{"kind":"build","q":"Make pictures to match the sentence.","sentence":"4 is less than 8.","targets":[4,8],"sign":"<","ex":"4 cubes is fewer than 8 cubes. 4 is less than 8."},
{"kind":"build","q":"Make pictures to match the sentence.","sentence":"1 ten and 2 ones is equal to 12.","targets":[12,12],"sign":"=","ex":"1 ten and 2 ones makes 12. Both pictures have 12 cubes."},
{"kind":"choice","q":"Choose <, > or = to compare.","sentence":"9 ___ 6","groups":[["9 counters",9,"frame"],["6 counters",6,"frame"]],"answers":[">","<","="],"ok":0,"ex":"9 is greater than 6: 9 > 6."},
{"kind":"choice","q":"Choose <, > or = to compare.","sentence":"0 ___ 0","groups":[["0",0,"cube"],["0",0,"cube"]],"answers":["<",">","="],"ok":2,"ex":"Both groups have no cubes. 0 is equal to 0."},
{"kind":"choice","q":"Choose <, > or = to compare.","sentence":"1 ten and 3 ones ___ 16","groups":[["1 ten and 3 ones",13,"tens"],["16",16,"cube"]],"answers":["=","<",">"],"ok":1,"ex":"1 ten and 3 ones makes 13. 13 is less than 16."},
{"kind":"choice","q":"Choose <, > or = to compare.","sentence":"20 ___ 1 ten and 8 ones","groups":[["20",20,"tens"],["1 ten and 8 ones",18,"tens"]],"answers":[">","=","<"],"ok":0,"ex":"1 ten and 8 ones makes 18. 20 is greater than 18."}
 ],
 3:[
 {kind:'mystery',small:'Kim',low:6,big:'Ron',high:8,who:'Max'},
 {kind:'mystery',small:'Ben',low:3,big:'Ava',high:5,who:'Leo'},
 {kind:'mystery',small:'Sam',low:5,big:'Mia',high:7,who:'Zoe'},

{"kind":"mystery","small":"Tom","low":2,"big":"Grace","high":4,"who":"Oscar"},
{"kind":"mystery","small":"Amy","low":8,"big":"Dan","high":10,"who":"Isla"},
{"kind":"mystery","small":"Oliver","low":5,"big":"Eva","high":9,"who":"Hugo"},

{"kind":"mystery","small":"Theo","low":10,"big":"Nora","high":14,"who":"Arlo"}
 ]
};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function cancel(){if(speechAvailable)window.speechSynthesis.cancel();document.querySelectorAll('.is-speaking').forEach(b=>b.classList.remove('is-speaking'))}
function pickVoice(){if(speechAvailable){const v=window.speechSynthesis.getVoices();voice=v.find(x=>/^en[-_]GB$/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}}
function speak(text,btn){if(!speechAvailable||!sound)return;cancel();pickVoice();const u=new SpeechSynthesisUtterance(text.replace(/___/g,' blank ').replace(/>/g,' greater than ').replace(/</g,' less than ').replace(/=/g,' equal to '));u.lang='en-GB';u.rate=.82;u.pitch=1;if(voice)u.voice=voice;u.onend=u.onerror=()=>btn?.classList.remove('is-speaking');btn?.classList.add('is-speaking');try{window.speechSynthesis.speak(u)}catch{btn?.classList.remove('is-speaking')}}
function items(n,type='cube'){
 if(type==='frame')return '<div class="ten-frame" role="img" aria-label="'+n+' counters in a ten frame">'+Array.from({length:10},(_,i)=>'<span class="frame-cell">'+(i<n?'<i></i>':'')+'</span>').join('')+'</div>';
 if(type==='tens')return '<div class="blocks" role="img" aria-label="'+Math.floor(n/10)+' tens and '+n%10+' ones">'+Array.from({length:Math.floor(n/10)},()=>'<span class="ten-rod">'+Array.from({length:10},()=>'<i></i>').join('')+'</span>').join('')+Array.from({length:n%10},()=>'<i class="cube"></i>').join('')+'</div>';
 return '<div class="blocks" role="img" aria-label="'+n+' '+(type==='cube'?'cubes':'objects')+'">'+(n?Array.from({length:n},()=>type==='cube'?'<i class="cube"></i>':'<span class="obj" aria-hidden="true">'+type+'</span>').join(''):'<span class="empty">No cubes</span>')+'</div>';
}
function group(name,n,type){return '<div class="group"><div class="group-title">'+esc(name)+'</div>'+items(n,type)+'</div>'}
function groups(gs){return '<div class="worksheet-groups">'+gs.map(g=>group(...g)).join('')+'</div>'}
function footer(){return '<div class="feedback" id="feedback" role="status"></div><button class="speak" id="hearAnswer" hidden>🔊 Hear the explanation</button><button class="primary" id="nextBtn" hidden>Next →</button>'}
function frame(title,q,body){card.innerHTML='<div class="eyebrow">'+title+'</div><h2 class="question" tabindex="-1">'+esc(q)+'</h2><button class="speak" id="hearQuestion">🔊 Hear the question</button>'+body+footer();$('#hearQuestion').hidden=!speechAvailable;$('#hearQuestion').onclick=e=>speak(lastSpeech,e.currentTarget);$('#hearAnswer').onclick=e=>speak(feedbackSpeech,e.currentTarget);$('#nextBtn').onclick=next;card.querySelector('h2').focus({preventScroll:true})}
function start(n){cancel();level=n;index=0;$('#home').classList.remove('active');$('#game').classList.add('active');render();speak(lastSpeech)}
function home(){cancel();$('#home').classList.add('active');$('#game').classList.remove('active')}
function current(){return levels[level][index]}
function render(){cancel();locked=false;counts=[0,0];const total=level===0?revisions.length:levels[level].length;$('#counter').textContent=(index+1)+' / '+total;$('#progressBar').style.width=(index/total*100)+'%';
 if(level===0){renderRevision();return}
 const x=current();
 if(x.kind==='mystery'){renderMystery(x);return}
 lastSpeech=x.q+' '+(x.sentence||'')+' '+(x.groups?x.groups.map(g=>g[0]+' has '+g[1]+'.').join(' '):'');
 let body=(x.sentence?'<p class="sentence">'+esc(x.sentence)+'</p>':'');
 if(x.kind==='choice'){
  body+=groups(x.groups)+'<div class="answer-row" style="--cols:'+x.answers.length+'">'+x.answers.map((a,i)=>'<button class="answer" data-answer="'+i+'" aria-label="'+esc(a==='<'?'Less than':a==='>'?'Greater than':a==='='?'Equal to':a)+'">'+esc(a)+'</button>').join('')+'</div>';
  frame('Level '+level+' · '+(level===1?'Pictures & words':'Make & compare'),x.q,body);
  card.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(locked)return;const yes=+b.dataset.answer===x.ok;b.classList.add(yes?'correct':'wrong');if(!yes)setTimeout(()=>b.classList.remove('wrong'),400);respond(yes,yes?x.ex:'Count each group again. Read the sentence from left to right.')});
 }else{
  body+='<p class="mini-note">Tap + to draw a cube. Tap − to take one away.</p><div class="build-pair">'+builder(0,'Left picture')+'<div class="big-symbol">'+esc(x.sign)+'</div>'+builder(1,'Right picture')+'</div><button class="primary" id="check">Check my pictures</button>';
  frame('Level 2 · Draw with cubes',x.q,body);wireBuilders();$('#check').onclick=()=>{const yes=counts.every((n,i)=>n===x.targets[i]);respond(yes,yes?x.ex:'Make '+x.targets[0]+' cubes on the left and '+x.targets[1]+' on the right. Count and try again.')};
 }
}
function renderRevision(){const x=revisions[index];lastSpeech=x.title+'. '+x.text+' '+x.tip;frame('Revision · Words and symbols',x.title,'<div class="revision-example">'+group(x.left+' cubes',x.left,'cube')+'<div class="big-symbol">'+esc(x.sign)+'</div>'+group(x.right+' cubes',x.right,'cube')+'</div><p class="sentence">'+x.left+' '+esc(x.sign)+' '+x.right+'</p><p class="revision-copy">'+esc(x.text)+'</p><p class="tip">'+esc(x.tip)+'</p><div class="finish-actions"><button class="answer" id="previous" '+(index===0?'disabled':'')+'>← Back</button><button class="primary" id="continue">'+(index===2?'Ready for Level 1 →':'Next symbol →')+'</button></div>');
 $('#hearQuestion').textContent='🔊 Read this to me';$('#previous').onclick=()=>{index--;render();speak(lastSpeech)};$('#continue').onclick=()=>{if(index===2)start(1);else{index++;render();speak(lastSpeech)}}}
function builder(i,label){return '<div class="builder"><h3>'+esc(label)+'</h3><div id="drawing'+i+'" class="drawing">'+items(0)+'</div><div class="build-controls"><button class="answer" data-change="-1" data-slot="'+i+'" aria-label="Remove one cube from '+esc(label)+'">−</button><output id="count'+i+'" aria-live="polite">0</output><button class="answer" data-change="1" data-slot="'+i+'" aria-label="Add one cube to '+esc(label)+'">+</button></div></div>'}
function wireBuilders(){card.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.slot;counts[i]=Math.max(0,Math.min(20,counts[i]+Number(b.dataset.change)));$('#drawing'+i).innerHTML=items(counts[i]);$('#count'+i).textContent=counts[i];updateControls()});updateControls()}
function updateControls(){card.querySelectorAll('[data-change]').forEach(b=>b.disabled=locked||(+b.dataset.change<0?counts[+b.dataset.slot]===0:counts[+b.dataset.slot]===20))}
function renderMystery(x){const clue=x.who+' has fewer cubes than '+x.big+', but more cubes than '+x.small+'.';lastSpeech=x.small+' has '+x.low+' cubes. '+x.big+' has '+x.high+' cubes. '+clue+' Make '+x.who+'’s cubes.';
 frame('Level 3 · Puzzle '+(index+1)+' of '+levels[3].length,'Make '+x.who+'’s cubes.',groups([[x.small,x.low,'cube'],[x.big,x.high,'cube']])+'<p class="clue">'+clue+'</p><p class="mini-note">Tap + to draw cubes. Your answer must match both clues.</p>'+builder(0,x.who+'’s picture')+'<div class="finish-actions"><button class="answer" id="hint">💡 Help me think</button><button class="primary" id="check">Check my cubes</button></div><div id="hintText" class="tip" hidden></div>');
 wireBuilders();$('#hint').onclick=()=>{const s='First, count '+x.small+'’s cubes: '+x.low+'. Then count '+x.big+'’s cubes: '+x.high+'. Choose a number bigger than '+x.low+' and smaller than '+x.high+'.';$('#hintText').hidden=false;$('#hintText').textContent=s;speak(s)};
 $('#check').onclick=()=>{const n=counts[0],yes=n>x.low&&n<x.high;const valid=Array.from({length:x.high-x.low-1},(_,i)=>x.low+i+1);respond(yes,yes?n+' works! '+n+' is more than '+x.low+' and fewer than '+x.high+'. '+(valid.length>1?'Other answers can work too: '+valid.join(', ')+'.':'Both clues fit.'):(n<=x.low?'You need more cubes than '+x.small+'’s '+x.low+'.':'You need fewer cubes than '+x.big+'’s '+x.high+'.')+' Try again.')}
}
function respond(yes,text){if(locked)return;feedbackSpeech=(yes?'Well done! ':'Not quite yet. ')+text;$('#feedback').textContent=feedbackSpeech;$('#feedback').className='feedback '+(yes?'good':'bad');$('#hearAnswer').hidden=!speechAvailable;
 if(yes){locked=true;stars++;$('#starCount').textContent=stars;$('#nextBtn').hidden=false;$('#nextBtn').textContent=index===levels[level].length-1?'Finish level →':'Next question →';card.querySelectorAll('[data-answer],#check').forEach(b=>b.disabled=true);updateControls();if(stars%3===0)confetti()}
 speak(feedbackSpeech);
}
function next(){index++;if(index===levels[level].length)finish();else{render();speak(lastSpeech)}}
function finish(){cancel();$('#progressBar').style.width='100%';$('#counter').textContent='Done!';card.innerHTML='<div class="finish"><div class="trophy">🏆</div><div class="eyebrow">Level '+level+' complete</div><h2 class="question">Brilliant comparing!</h2><p>You have '+stars+' stars. Keep counting and thinking!</p><div class="finish-actions">'+(level<3?'<button class="primary" id="nextLevel">Level '+(level+1)+' →</button>':'')+'<button class="answer" id="replay">Play again</button><button class="answer" id="finishHome">Home</button></div></div>';$('#replay').onclick=()=>start(level);$('#finishHome').onclick=home;if($('#nextLevel'))$('#nextLevel').onclick=()=>start(level+1);confetti();speak('Brilliant comparing! Level complete.')}
function confetti(){if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<24;i++){const d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=['#5b3df5','#ffd659','#4ed6ad','#ff7196'][i%4];d.style.setProperty('--drift',(Math.random()*160-80)+'px');document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}}
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level));$('#backBtn').onclick=home;$('#soundToggle').hidden=!speechAvailable;$('#soundToggle').onclick=e=>{sound=!sound;cancel();e.currentTarget.textContent=sound?'🔊':'🔇';e.currentTarget.setAttribute('aria-label',sound?'Turn sound off':'Turn sound on');if(sound)speak('Sound on.')};if(speechAvailable){pickVoice();window.speechSynthesis.addEventListener('voiceschanged',pickVoice)}
})();
</script>
</body>
</html>
