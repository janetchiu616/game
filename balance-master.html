<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Balance Master</title>
<style>
:root{--ink:#26345d;--sky:#dff6ff;--cream:#fffaf0;--purple:#7756d8;--green:#36ad72;--gold:#ffc94d;--red:#ee6d6d;--shadow:0 8px 0 rgba(60,59,105,.13)}
*{box-sizing:border-box} body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(#ccefff 0 44%,#dff4c6 44% 100%);min-height:100vh;overflow-x:hidden}
button,select{font:inherit} button{touch-action:manipulation}.app{width:min(1050px,100%);margin:auto;padding:12px 14px 30px}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fffdf5e8;border:3px solid #fff;border-radius:24px;padding:10px 14px;box-shadow:var(--shadow)}
h1{font-size:clamp(25px,5vw,42px);margin:0;color:#5c43b4;letter-spacing:.5px}.power{margin-left:auto;min-width:min(270px,100%)}.powerline{display:flex;justify-content:space-between;font-weight:bold}.bar{height:18px;background:#e8e5ef;border-radius:20px;overflow:hidden;border:2px solid #aaa1c8}.fill{height:100%;width:0;background:linear-gradient(90deg,#ffd43b,#ff8e44,#bc63e7);transition:width .5s}.controls{display:flex;align-items:center;gap:8px}.iconbtn,.smallbtn{border:0;border-radius:14px;background:#fff;padding:9px 12px;box-shadow:0 4px 0 #cbc5de;cursor:pointer;font-weight:bold;color:var(--ink)}select{border:2px solid #b7acd9;border-radius:12px;padding:7px;background:white;color:var(--ink)}
.levelnav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.level{border:3px solid #fff;background:#ffffffd9;border-radius:18px;padding:10px 6px;min-height:70px;cursor:pointer;color:var(--ink);box-shadow:0 5px 0 #aec999;font-weight:bold}.level span{display:block;font-size:22px}.level.active{background:#7558d8;color:white;transform:translateY(3px);box-shadow:0 2px 0 #49329a}.level.locked{filter:grayscale(.7);opacity:.6}
.game{background:#fffdf3e8;border:4px solid #fff;border-radius:28px;padding:clamp(12px,3vw,24px);box-shadow:var(--shadow);position:relative}.headline{text-align:center}.headline h2{margin:0;font-size:clamp(22px,4vw,34px)}.prompt{font-size:clamp(17px,3vw,23px);font-weight:bold;margin:6px 0 2px}.clues{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:48px;margin-top:7px}.clue{background:#ece6ff;border:2px solid #c4b5fa;border-radius:14px;padding:7px 12px;font-weight:bold}.picture-clue{display:flex;align-items:center;gap:8px;background:#f1ecff;border:2px solid #c4b5fa;border-radius:16px;padding:7px 11px}.mini-pan{display:flex;align-items:center;justify-content:center;min-width:58px;min-height:43px;padding:3px 8px 7px;border-bottom:5px solid #58bce5;border-radius:0 0 50% 50%;font-size:25px;line-height:1}.mini-pan .item{font-size:25px}.mini-pan .box{width:31px;height:31px;border-width:3px;font-size:20px}.mini-equals{font-size:24px;font-weight:900;color:#6a4bc4}.assumption-label{width:100%;font-size:14px;font-weight:bold;color:#684db3}
.scale-zone{height:330px;position:relative;margin-top:0}.scale{position:absolute;left:50%;bottom:20px;width:min(720px,96%);height:270px;transform:translateX(-50%)}.beam-wrap{position:absolute;left:8%;right:8%;top:72px;height:170px;transform:rotate(var(--tilt,0deg));transition:transform 1s cubic-bezier(.3,1.5,.5,1);transform-origin:center 16px}.beam{position:absolute;left:0;right:0;top:0;height:16px;border-radius:12px;background:linear-gradient(#ffd766,#dda222);border:3px solid #9d7021}.joint{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:42px;height:42px;border-radius:50%;background:#ffcf48;border:5px solid #9d7021}.rope{position:absolute;top:13px;width:4px;height:88px;background:#89693b}.rope.l{left:5%}.rope.r{right:5%}.pan{position:absolute;top:98px;width:36%;min-height:72px;border-radius:12px 12px 50% 50%;background:linear-gradient(#9ee4ff,#58bce5);border:4px solid #287fa9;display:flex;align-items:flex-end;justify-content:center;align-content:center;gap:2px;flex-wrap:wrap;padding:6px 4px 16px}.pan.left{left:-12%}.pan.right{right:-12%;border-style:dashed}.stand{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:24px;height:195px;background:linear-gradient(90deg,#a66e30,#e9b758,#a66e30);border:3px solid #855522;border-radius:12px}.base{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:180px;height:24px;background:#bd803b;border:3px solid #855522;border-radius:50%}.item{font-size:clamp(31px,6vw,52px);line-height:1;filter:drop-shadow(0 3px 1px #0002);user-select:none}.box{display:inline-grid;place-items:center;width:50px;height:50px;background:#a56bd8;border:4px solid #673e9f;border-radius:9px;color:white;font-size:29px;font-weight:bold}
.tray-title{text-align:center;font-weight:bold;margin:2px}.tray{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;min-height:88px;background:#fff;border:3px dashed #cfb976;border-radius:20px;padding:9px}.fruitbtn{min-width:76px;min-height:68px;border:0;border-radius:16px;background:#fff4c7;box-shadow:0 5px 0 #d8bc58;cursor:grab;font-size:42px;position:relative}.fruitbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #d8bc58}.fruitbtn small{font-size:14px;display:block;color:var(--ink);font-weight:bold}.answer-item{cursor:pointer}.actions{display:flex;justify-content:center;gap:12px;margin-top:14px}.weigh{border:0;border-radius:18px;padding:14px 28px;background:linear-gradient(#ffde5b,#f5a929);color:#553200;font-weight:900;font-size:clamp(20px,4vw,28px);box-shadow:0 7px 0 #c87e16;cursor:pointer}.weigh:active{transform:translateY(4px);box-shadow:0 3px 0 #c87e16}.clear{border:0;border-radius:16px;background:#e8e5f3;padding:12px 18px;font-weight:bold;color:var(--ink);cursor:pointer}.message{text-align:center;font-size:22px;font-weight:bold;min-height:34px;margin:8px 0 0}.success{animation:pop .6s}.spark{position:absolute;pointer-events:none;font-size:35px;animation:spark 1s forwards}.dragging{opacity:.45}.drop-hot{background:#ffe178!important}
.teaching{display:none;margin:9px auto 12px;max-width:760px;background:#fff7cf;border:3px solid #efc64b;border-radius:20px;padding:10px 14px;text-align:center}.teaching.show{display:block;animation:pop .35s}.roadmap{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}.roadstep{padding:6px 10px;border-radius:13px;background:#e7e3ee;color:#736d80;font-weight:bold}.roadstep.active{background:#7558d8;color:#fff;box-shadow:0 3px 0 #49329a}.roadarrow{font-weight:bold;color:#8d7a3a}.teach-word{font-size:19px;font-weight:bold;margin:7px}.teach-graphic{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;min-height:66px}.teach-group-wrap{display:grid;justify-items:center;gap:4px}.teach-group-wrap small{font-weight:bold;color:#564d38;max-width:230px}.teach-group{display:flex;align-items:center;justify-content:center;gap:2px;background:#fff;border-bottom:6px solid #55bce8;border-radius:14px 14px 50% 50%;padding:7px 12px 11px;min-width:70px;flex-wrap:wrap}.teach-group .item{font-size:31px}.teach-group .box{width:38px;height:38px;font-size:23px}.teach-arrow{font-size:29px;color:#6a4bc4;font-weight:bold}.group-demo{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;width:100%}.substitution-group{background:#fff;border:3px solid #b69af7;border-radius:16px;padding:7px;display:grid;gap:5px;justify-items:center}.group-label{background:#7558d8;color:#fff;border-radius:10px;padding:3px 9px;font-size:14px;font-weight:bold}.group-equation{display:flex;align-items:center;gap:5px}.group-equation .item{font-size:29px}.group-equals{font-size:22px;color:#6a4bc4;font-weight:bold}.join-line{width:100%;font-weight:bold;color:#6a4bc4;font-size:18px;margin-top:2px}.pulse{animation:hintpulse .8s ease-in-out 2}.help{border:0;border-radius:16px;background:#7756d8;color:#fff;padding:12px 18px;font-weight:bold;box-shadow:0 5px 0 #4c329e;cursor:pointer}.help:active{transform:translateY(3px);box-shadow:0 2px 0 #4c329e}@keyframes hintpulse{50%{transform:scale(1.13);filter:drop-shadow(0 0 8px #ffb300)}}
.overlay{position:fixed;inset:0;background:#432d78d9;display:none;place-items:center;padding:20px;z-index:10}.overlay.show{display:grid}.celebrate{background:#fffaf0;border:6px solid #ffd34c;border-radius:30px;padding:28px;text-align:center;max-width:520px;box-shadow:0 15px 0 #2c1d5b}.celebrate .big{font-size:80px}.celebrate h2{font-size:36px;margin:5px}.celebrate button{border:0;border-radius:16px;padding:13px 24px;background:#5fbd78;color:white;font-size:22px;font-weight:bold;cursor:pointer}
@keyframes pop{30%{transform:scale(1.04)}60%{transform:scale(.98)}}@keyframes spark{to{transform:translate(var(--x),var(--y)) rotate(160deg);opacity:0}}@media(max-width:650px){.levelnav{grid-template-columns:repeat(5,70px);overflow-x:auto;padding-bottom:5px}.level{font-size:11px}.scale-zone{height:275px}.scale{height:230px}.beam-wrap{top:58px}.stand{height:165px}.pan{width:39%;top:88px;min-height:65px}.item{font-size:36px}.fruitbtn{min-width:64px}.top{align-items:flex-start}.power{order:3;width:100%;margin:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
 <header class="top"><h1>⚖️ Balance Master</h1><div class="controls"><button class="iconbtn" id="sound" aria-label="Turn voice on or off">🔊</button><select id="lang" aria-label="Voice language"><option value="en-GB">English (UK)</option><option value="zh-HK">廣東話</option><option value="zh-CN">普通話</option></select></div><div class="power"><div class="powerline"><span>⚡ Balance Power</span><span id="powerText">0 / 10</span></div><div class="bar"><div class="fill" id="powerFill"></div></div></div></header>
 <nav class="levelnav" id="levelnav" aria-label="Choose a level"></nav>
 <section class="game" id="game">
  <div class="headline"><h2 id="levelTitle"></h2><div class="prompt" id="prompt"></div><div class="clues" id="clues"></div></div>
  <div class="scale-zone"><div class="scale"><div class="stand"></div><div class="base"></div><div class="beam-wrap" id="beam"><div class="beam"></div><div class="joint"></div><div class="rope l"></div><div class="rope r"></div><div class="pan left" id="leftPan"></div><div class="pan right" id="rightPan" aria-label="Your side of the scale"></div></div></div></div>
  <div class="teaching" id="teaching" aria-live="polite"><div class="roadmap" id="roadmap"></div><div class="teach-word" id="teachWord"></div><div class="teach-graphic" id="teachGraphic"></div></div>
  <div class="tray-title" id="trayTitle">Tap or drag objects onto the empty pan</div><div class="tray" id="tray"></div>
  <div class="actions"><button class="clear" id="clear">↩ Clear</button><button class="help" id="help">💡 Help Me</button><button class="weigh" id="weigh">⚖️ WEIGH IT!</button></div><div class="message" id="message" aria-live="polite"></div>
 </section>
</main>
<div class="overlay" id="overlay"><div class="celebrate"><div class="big">🏆</div><h2>Balance Master!</h2><p>You solved the final mystery and filled your Balance Power!</p><button id="again">Play Again</button></div></div>
<script>
(()=>{
const fruits={apple:{e:'🍎',w:2,n:'apple'},pear:{e:'🍐',w:3,n:'pear'},banana:{e:'🍌',w:4,n:'banana'},orange:{e:'🍊',w:5,n:'orange'},grape:{e:'🍇',w:1,n:'grapes'},box:{e:'?',w:0,n:'mystery box'}};
const A='apple',P='pear',B='banana',O='orange',G='grape',X='box';
const Q=(left,answer,choices,assumptions=[],boxWeight=0)=>({left,answer,choices,assumptions,boxWeight});
const levels=[
 {name:'Make It Balance',icon:'🍎',intro:'Copy the fruit so both sides match.',qs:[
  Q([A],[A],[G,A,P]),Q([P],[P],[A,P,B]),Q([B],[B],[P,B,O]),Q([O],[O],[B,O,G]),Q([G,G],[G,G],[G,A,P]),
  Q([A,A],[A,A],[G,A,P]),Q([P,P],[P,P],[A,P,B]),Q([B,B],[B,B],[A,B,O]),Q([O,O],[O,O],[G,B,O]),Q([A,P],[A,P],[A,P,B])]},
 {name:'Same Weight',icon:'🍐',intro:'Use the picture clue to build the same weight.',qs:[
  Q([A,A,A],[P,P],[A,P,G],[[[A,A,A],[P,P]]]),Q([B],[A,A],[G,A,P],[[[B],[A,A]]]),Q([O],[P,A],[A,P,O],[[[O],[P,A]]]),
  Q([P],[G,G,G],[G,A,P],[[[P],[G,G,G]]]),Q([A],[G,G],[G,A,P],[[[A],[G,G]]]),Q([B,B],[A,A,A,A],[A,B,G],[[[B],[A,A]]]),
  Q([O,O],[B,P,G,G,G],[G,P,B,O],[[[O],[B,G]]]),Q([P,P],[A,A,A],[A,P,G],[[[P,P],[A,A,A]]]),
  Q([B,P],[O,A],[A,P,B,O],[[[B],[A,A]],[[O],[P,A]]]),Q([O,P],[B,B],[G,P,B,O],[[[O],[B,G]],[[P],[G,G,G]],[[B],[G,G,G,G]]])]},
 {name:'Swap the Weight',icon:'🍌',intro:'Follow the picture clues and swap groups.',qs:[
  Q([B,B],[A,A,A,A],[A,P,B],[[[B],[A,A]]]),Q([P,P,P,P],[B,B,B],[A,P,B],[[[P,P],[A,A,A]],[[B],[A,A]]]),
  Q([O,O],[B,B,A],[A,B,O],[[[O],[B,G]],[[A],[G,G]]]),Q([P,P],[G,G,G,G,G,G],[G,A,P],[[[P],[G,G,G]]]),
  Q([O,B],[A,A,A,A,G],[G,A,B,O],[[[O],[B,G]],[[B],[A,A]]]),Q([A,A,A],[P,P],[A,P,G],[[[A,A,A],[P,P]]]),
  Q([B,B,B],[P,P,P,P],[A,P,B],[[[B],[A,A]],[[A,A,A],[P,P]]]),Q([O,O,O],[B,B,B,G,G,G],[G,B,O],[[[O],[B,G]]]),
  Q([P,B],[A,A,G,G,G],[G,A,P,B],[[[P],[G,G,G]],[[B],[A,A]]]),Q([O,P],[A,A,G,G,G,G],[G,A,P,O],[[[O],[P,A]],[[P],[G,G,G]],[[A],[G,G]]])]},
 {name:'Mystery Weight',icon:'❓',intro:'Use the picture to unpack the mystery box.',qs:[
  Q([X],[P,P],[G,A,P],[[[X],[A,A,A]],[[A,A,A],[P,P]]],6),Q([X],[B,B],[A,P,B],[[[X],[B,B]]],8),Q([X],[O,O],[G,A,O],[[[X],[O,O]]],10),
  Q([X],[A,A],[G,A,P],[[[X],[A,A]]],4),Q([X],[P,P,P],[A,P,B],[[[X],[P,P,P]]],9),Q([X],[B,B,B],[A,B,O],[[[X],[B,B,B]]],12),
  Q([X],[O,O,O],[G,P,O],[[[X],[O,O,O]]],15),Q([X],[A,P],[A,P,B],[[[X],[A,P]]],5),Q([X],[B,G],[G,A,B],[[[X],[B,G]]],5),
  Q([X],[O,P],[A,P,O],[[[X],[O,P]]],8)]},
 {name:'Balance Detective',icon:'🔎',intro:'Final challenge! Connect all the picture clues.',qs:[
  Q([X],[B,B,B],[A,P,B],[[[P,P],[A,A,A]],[[B],[A,A]],[[X],[P,P,P,P]]],12),
  Q([X],[O,O,O],[G,P,O],[[[O],[P,A]],[[A,A,A],[P,P]],[[X],[P,P,P,P,P]]],15),
  Q([X],[A,A,A],[A,P,B],[[[B],[A,A]],[[X],[B,A]]],6),Q([X],[P,P],[G,A,P],[[[P],[G,G,G]],[[X],[G,G,G,G,G,G]]],6),
  Q([X],[B,B],[A,B,O],[[[B],[G,G,G,G]],[[X],[G,G,G,G,G,G,G,G]]],8),Q([X],[O,O],[G,P,O],[[[O],[P,A]],[[X],[P,P,A,A]]],10),
  Q([X],[P,P,P],[A,P,B],[[[P],[G,G,G]],[[A],[G,G]],[[X],[A,A,A,A,G]]],9),Q([X],[B,B,B],[G,A,B],[[[B],[A,A]],[[X],[A,A,A,A,A,A]]],12),
  Q([X],[O,O,O],[A,P,O],[[[O],[P,A]],[[X],[P,P,P,A,A,A]]],15),Q([X],[O,O,O,O],[G,B,O],[[[O],[B,G]],[[X],[B,B,B,B,G,G,G,G]]],20)]}
];
let level=0,qIndex=0,placed=[],power=0,soundOn=true,busy=false,tries=0,guideStep=0;
const $=s=>document.querySelector(s),nav=$('#levelnav'),beam=$('#beam'),left=$('#leftPan'),right=$('#rightPan'),tray=$('#tray'),msg=$('#message');
function speak(key){if(!soundOn||!('speechSynthesis'in window))return;const words={good:{'en-GB':'Brilliant! It balances!','zh-HK':'好叻呀！平衡啦！','zh-CN':'太棒了！平衡啦！'},light:{'en-GB':'Good try. Your side is too light. Add one small fruit at a time.','zh-HK':'試得好。你嗰邊太輕。每次加一個生果。','zh-CN':'试得好。你这边太轻。每次加一个水果。'},heavy:{'en-GB':'Good try. Your side is too heavy. Take away one fruit, then weigh it again.','zh-HK':'試得好。你嗰邊太重。拎走一個生果，再磅一次。','zh-CN':'试得好。你这边太重。拿走一个水果，再称一次。'},look:{'en-GB':'First, look at the picture clue. Find the fruit group that matches.','zh-HK':'第一步，睇吓圖片提示。搵出相同重量嘅生果組合。','zh-CN':'第一步，看看图片提示。找出相同重量的水果组合。'},swap:{'en-GB':'Now swap one equal group at a time. You only need to change one small group.','zh-HK':'而家每次交換一組相同重量嘅生果。一次做一小組就得啦。','zh-CN':'现在每次交换一组相同重量的水果。一次做一小组就可以。'},balance:{'en-GB':'Great thinking. Start with this fruit, then finish the group and balance the scale.','zh-HK':'諗得好。由呢個生果開始，再完成組合令個秤平衡。','zh-CN':'想得很好。从这个水果开始，再完成组合让秤平衡。'},closer:{'en-GB':'You are getting closer. Follow the three steps: look, swap, then balance.','zh-HK':'越嚟越接近啦。跟住三步：睇、交換、再平衡。','zh-CN':'越来越接近了。跟着三步：看、交换、再平衡。'}};speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(words[key][$('#lang').value]);u.lang=$('#lang').value;u.rate=.84;speechSynthesis.speak(u)}
function itemHTML(k,answer=false,i=0){return k==='box'?'<span class="box" aria-label="mystery box">?</span>':`<span class="item ${answer?'answer-item':''}" ${answer?`data-i="${i}" role="button" aria-label="Remove ${fruits[k].n}"`:''}>${fruits[k].e}</span>`}
function navRender(){nav.innerHTML=levels.map((l,i)=>`<button class="level ${i===level?'active':''}" data-level="${i}"><span>${l.icon}</span>${i+1}. ${l.name}</button>`).join('')}
function cluePictures(groups){if(!groups.length)return '';return `<div class="assumption-label">👀 What we know:</div>`+groups.map(([a,b])=>`<div class="picture-clue" aria-label="Two equal groups"><div class="mini-pan">${a.map(x=>itemHTML(x)).join('')}</div><div class="mini-equals">=</div><div class="mini-pan">${b.map(x=>itemHTML(x)).join('')}</div></div>`).join('')}
function render(){busy=false;tries=0;guideStep=0;beam.style.setProperty('--tilt','0deg');const L=levels[level],q=L.qs[qIndex%L.qs.length];$('#levelTitle').textContent=`Level ${level+1}: ${L.name} — ${qIndex%10+1}/10`;$('#prompt').textContent=L.intro;$('#clues').innerHTML=cluePictures(q.assumptions);left.innerHTML=q.left.map(x=>itemHTML(x)).join('');placed=[];renderRight();tray.innerHTML=q.choices.map(k=>`<button class="fruitbtn" draggable="true" data-fruit="${k}" aria-label="Add ${fruits[k].n}">${fruits[k].e}<small>${fruits[k].n}</small></button>`).join('');msg.textContent='';$('#teaching').classList.remove('show');navRender();bindTray()}
function renderRight(){right.innerHTML=placed.map((x,i)=>itemHTML(x,true,i)).join('');right.querySelectorAll('.answer-item').forEach(x=>x.onclick=()=>{placed.splice(+x.dataset.i,1);renderRight()})}
function bindTray(){tray.querySelectorAll('.fruitbtn').forEach(b=>{b.onclick=()=>add(b.dataset.fruit);b.ondragstart=e=>{e.dataTransfer.setData('text/plain',b.dataset.fruit);b.classList.add('dragging')};b.ondragend=()=>b.classList.remove('dragging')})}
function add(k){if(placed.length<8){placed.push(k);renderRight();right.classList.add('drop-hot');setTimeout(()=>right.classList.remove('drop-hot'),180)}}
right.ondragover=e=>{e.preventDefault();right.classList.add('drop-hot')};right.ondragleave=()=>right.classList.remove('drop-hot');right.ondrop=e=>{e.preventDefault();right.classList.remove('drop-hot');add(e.dataTransfer.getData('text/plain'))};
function weight(arr,q){return arr.reduce((s,k)=>s+(k==='box'?q.boxWeight:fruits[k].w),0)}
function sparkle(){for(let i=0;i<16;i++){let s=document.createElement('span');s.className='spark';s.textContent=['✨','⭐','🎉'][i%3];s.style.left=(45+Math.random()*10)+'%';s.style.top='42%';s.style.setProperty('--x',(Math.random()*500-250)+'px');s.style.setProperty('--y',(Math.random()*-230-20)+'px');$('#game').append(s);setTimeout(()=>s.remove(),1100)}}
function describeGroup(arr){const order=[X,O,B,P,A,G],counts={};arr.forEach(x=>counts[x]=(counts[x]||0)+1);return order.filter(x=>counts[x]).map(x=>{const n=counts[x],name=x===X?'mystery box':fruits[x].n;return `${n} ${name}${n>1&&name!=='grapes'?'s':''}`}).join(' and ')}
function teachGroup(arr,pulse=false){return `<div class="teach-group-wrap"><div class="teach-group ${pulse?'pulse':''}">${arr.map(x=>itemHTML(x)).join('')}</div><small>${describeGroup(arr)}</small></div>`}
function groupingFor(q){if(q.left.length<2||!q.left.every(x=>x===q.left[0]))return null;const rule=q.assumptions.find(r=>r[0].length===1&&r[0][0]===q.left[0]);if(!rule)return null;const replacements=Array.from({length:q.left.length},()=>rule[1]);return {source:q.left[0],replacement:rule[1],groups:replacements,combined:replacements.flat()}}
function groupingGraphic(d){const cards=d.groups.map((group,i)=>`<div class="substitution-group"><span class="group-label">Group ${i+1}</span><div class="group-equation">${itemHTML(d.source)}<span class="group-equals">=</span>${group.map(x=>itemHTML(x)).join('')}</div></div>`).join('');return `<div class="group-demo">${cards}<div class="join-line">Join the groups together ↓</div>${teachGroup(d.combined,true)}</div>`}
function showHelp(fromMistake=false,voiceOverride=''){const q=levels[level].qs[qIndex%10],rules=q.assumptions,demo=groupingFor(q),groupStep=rules.length+2,maxStep=rules.length+(demo?4:3);guideStep=Math.min(maxStep,guideStep+1);let stage=guideStep===1?0:(guideStep<=rules.length+1||(demo&&guideStep===groupStep))?1:2;const labels=level>=2?['👀 Understand','🧺 Make groups','⚖️ Build the answer']:['👀 Look','🔢 Count','⚖️ Copy'];$('#roadmap').innerHTML=labels.map((x,i)=>`<span class="roadstep ${i===stage?'active':''}">${x}</span>${i<2?'<span class="roadarrow">→</span>':''}`).join('');let word='',graphic='',voice='look';if(guideStep===1){word=`Start here: the left pan has ${describeGroup(q.left)}. Your job is to build another group with exactly the same weight.`;graphic=teachGroup(q.left,true)+'<span class="teach-arrow">→ ?</span>';voice='look'}else if(guideStep<=rules.length+1){const i=guideStep-2,pair=rules[i];word=`Rule ${i+1} of ${rules.length}: ${describeGroup(pair[0])} weighs the same as ${describeGroup(pair[1])}. We will use this rule to make matching groups.`;graphic=teachGroup(pair[0],true)+'<span class="teach-arrow">⇄</span>'+teachGroup(pair[1],true);voice='swap'}else if(demo&&guideStep===groupStep){word=`The left pan has ${describeGroup(q.left)}, so make ${demo.groups.length} replacement groups. Each group has ${describeGroup(demo.replacement)}. Together they make ${describeGroup(demo.combined)}.`;graphic=groupingGraphic(demo);voice='swap'}else{word=`Now copy this result onto your pan: ${describeGroup(q.answer)}. It has the same weight as ${describeGroup(q.left)}.`;graphic=teachGroup(q.left)+'<span class="teach-arrow">⇒</span>'+teachGroup(q.answer,true);voice='balance';if(guideStep===maxStep&&!placed.length){placed.push(q.answer[0]);renderRight();word+=` I placed the first ${fruits[q.answer[0]].n}; you finish the rest.`}}$('#teachWord').textContent=word;$('#teachGraphic').innerHTML=graphic;$('#teaching').classList.add('show');speak(voiceOverride||voice);if(!fromMistake)$('#teaching').scrollIntoView({behavior:'smooth',block:'nearest'})}
function check(){if(busy)return;const q=levels[level].qs[qIndex%levels[level].qs.length],a=weight(q.left,q),b=weight(placed,q);beam.style.setProperty('--tilt',b===a?'0deg':b<a?'-8deg':'8deg');if(b===a&&placed.length){busy=true;msg.textContent='🌟 Brilliant! Perfectly balanced!';msg.style.color='#208b56';$('#game').classList.add('success');sparkle();speak('good');power=Math.min(10,power+1);updatePower();setTimeout(()=>{$('#game').classList.remove('success');if(level===4&&qIndex===9&&power>=10){$('#overlay').classList.add('show')}else{qIndex=(qIndex+1)%10;render()}},1300)}else{tries++;const light=b<a;let hint=light?'Your pan is too light. Add one fruit, then weigh again. 🌱':'Your pan is too heavy. Tap a fruit on your pan to remove it. 🌈';if(tries>=2)hint='Read the exact rule in the yellow help panel, then make only that one swap. 👀';if(guideStep>=q.assumptions.length+2)hint='The complete matching fruit group is now shown. Copy that group onto your pan. 💡';msg.textContent='💛 Good try! '+hint;msg.style.color='#8a4d12';showHelp(true,tries===1?(light?'light':'heavy'):'')}}
function updatePower(){ $('#powerText').textContent=`${power} / 10`;$('#powerFill').style.width=(power*10)+'%';localStorage.setItem('balancePower',power)}
nav.onclick=e=>{const b=e.target.closest('[data-level]');if(b){level=+b.dataset.level;qIndex=0;render()}};$('#weigh').onclick=check;$('#help').onclick=()=>showHelp(false);$('#clear').onclick=()=>{placed=[];renderRight();beam.style.setProperty('--tilt','0deg');msg.textContent=''};$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'🔊':'🔇'};$('#lang').onchange=()=>speak('good');$('#again').onclick=()=>{power=0;level=0;qIndex=0;updatePower();$('#overlay').classList.remove('show');render()};
try{power=Math.max(0,Math.min(10,+localStorage.getItem('balancePower')||0))}catch(e){} updatePower();render();
})();
</script>
</body>
